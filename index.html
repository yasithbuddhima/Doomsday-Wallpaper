<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Avengers: Doomsday Countdown</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&display=swap");

      body,
      html {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background-color: #000;
        font-family: "Oswald", sans-serif;
        color: #fff;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        isolation: isolate;
      }

      .background {
        position: absolute;
        inset: 0;
        background-image: url("./avengers-doomsday-3840x2160-19004.jpg");
        background-size: cover;
        background-position: center;
        z-index: 0;
      }

      .overlay {
        position: absolute;
        inset: 0;
        background: linear-gradient(
          to bottom,
          rgba(0, 25, 10, 0.5),
          rgba(0, 0, 0, 0.95)
        );
        z-index: 1;
      }

      .countdown-container {
        position: relative;
        z-index: 2;
        text-align: center;
        padding-top: 10vh;
      }

      .title {
        font-size: 1.5vw;
        letter-spacing: 0.3em;
        margin-bottom: 30px;
        text-transform: uppercase;
        font-weight: 500;
        color: #e0e0e0;
      }

      .timer-row {
        display: flex;
        justify-content: center;
        align-items: flex-start;
        gap: 20px;
      }

      .time-box {
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 8vw;
      }

      .time-box .number {
        font-size: 5vw;
        font-weight: 700;
        line-height: 1;
        text-shadow: 0 0 15px rgba(74, 222, 128, 0.4);
      }

      .time-box .label {
        font-size: 0.75vw;
        letter-spacing: 0.25em;
        margin-top: 15px;
        color: #888;
        text-transform: uppercase;
        font-weight: 500;
      }

      .colon {
        font-size: 4vw;
        font-weight: 700;
        margin-top: -0.5vw;
        color: #555;
        animation: pulse 1s infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.2;
        }
      }

      @media (max-width: 768px) {
        .title {
          font-size: 4vw;
        }
        .time-box {
          width: 15vw;
        }
        .time-box .number {
          font-size: 8vw;
        }
        .time-box .label {
          font-size: 2vw;
        }
        .colon {
          font-size: 6vw;
          margin-top: 0;
        }
        .timer-row {
          gap: 10px;
        }
      }
    </style>
  </head>
  <body>
    <div class="background"></div>
    <div class="overlay"></div>

    <div class="countdown-container">
      <div class="title">Doomsday Is Coming</div>
      <div class="timer-row">
        <div class="time-box">
          <div class="number" id="months">00</div>
          <div class="label">Months</div>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <div class="number" id="days">00</div>
          <div class="label">Days</div>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <div class="number" id="hours">00</div>
          <div class="label">Hours</div>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <div class="number" id="minutes">00</div>
          <div class="label">Minutes</div>
        </div>
        <div class="colon">:</div>
        <div class="time-box">
          <div class="number" id="seconds">00</div>
          <div class="label">Seconds</div>
        </div>
      </div>
    </div>

    <script>
      // Official release date for Avengers: Doomsday (December 18, 2026)
      const targetDate = new Date("2026-12-18T00:00:00");

      function updateCountdown() {
        const now = new Date();
        const diff = targetDate - now;

        if (diff <= 0) {
          document.querySelector(".timer-row").innerHTML =
            '<div class="title" style="font-size: 3vw; color: #4ade80; text-shadow: 0 0 20px #4ade80;">THE TIME HAS COME</div>';
          return;
        }

        let seconds = Math.floor(diff / 1000) % 60;
        let minutes = Math.floor(diff / (1000 * 60)) % 60;
        let hours = Math.floor(diff / (1000 * 60 * 60)) % 24;

        let target = new Date(targetDate);
        let current = new Date(now);

        let months =
          target.getMonth() -
          current.getMonth() +
          12 * (target.getFullYear() - current.getFullYear());
        let days = target.getDate() - current.getDate();

        if (
          target.getHours() < current.getHours() ||
          (target.getHours() === current.getHours() &&
            target.getMinutes() < current.getMinutes()) ||
          (target.getHours() === current.getHours() &&
            target.getMinutes() === current.getMinutes() &&
            target.getSeconds() < current.getSeconds())
        ) {
          days--;
        }

        if (days < 0) {
          months--;
          let prevMonth = new Date(target.getFullYear(), target.getMonth(), 0);
          days += prevMonth.getDate();
        }

        const format = (n) => n.toString().padStart(2, "0");

        document.getElementById("months").innerText = format(months);
        document.getElementById("days").innerText = format(days);
        document.getElementById("hours").innerText = format(hours);
        document.getElementById("minutes").innerText = format(minutes);
        document.getElementById("seconds").innerText = format(seconds);
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    </script>
  </body>
</html>
